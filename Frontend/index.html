<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Personalized indoor plant styling, balcony makeovers, landscaping, and professional plant wellness services." />
  <link rel="icon" type="image/png" href="/favicons.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:is(.dark *));

      @theme inline {
        --font-display: "Cormorant Garamond", ui-serif, Georgia, serif;
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-destructive-foreground: var(--destructive-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-cream: var(--cream);
        --color-sage: var(--sage);
        --color-peach: var(--peach);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);
        --color-sidebar: var(--sidebar);
        --color-sidebar-foreground: var(--sidebar-foreground);
        --color-sidebar-primary: var(--sidebar-primary);
        --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
        --color-sidebar-accent: var(--sidebar-accent);
        --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
        --color-sidebar-border: var(--sidebar-border);
        --color-sidebar-ring: var(--sidebar-ring);
      }

  :root {
    --radius: 0.75rem;
    --background: oklch(0.99 0.005 60);
    --foreground: oklch(0.22 0.01 45);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.22 0.01 45);
    --popover: oklch(1 0 0);
    --popover-foreground: oklch(0.22 0.01 45);
    --primary: #F28500;
    --primary-foreground: oklch(0.985 0.008 95);
    --secondary: oklch(0.96 0.015 60);
    --secondary-foreground: oklch(0.4 0.09 45);
    --muted: oklch(0.97 0.01 60);
    --muted-foreground: oklch(0.55 0.02 45);
    --accent: oklch(0.78 0.14 60);
    --accent-foreground: oklch(0.2 0.04 60);
    --destructive: oklch(0.6 0.22 27);
    --destructive-foreground: oklch(0.985 0.008 95);
    --border: oklch(0.92 0.01 60);
    --input: oklch(0.94 0.01 60);
    --ring: #F28500;
    --cream: oklch(0.98 0.01 70);
    --sage: oklch(0.75 0.06 60);
    --peach: oklch(0.82 0.13 55);
    --chart-1: oklch(0.68 0.19 45);
    --chart-2: oklch(0.7 0.13 60);
    --chart-3: oklch(0.45 0.08 200);
    --chart-4: oklch(0.65 0.15 30);
    --chart-5: oklch(0.5 0.1 280);
    --sidebar: oklch(0.98 0.008 60);
    --sidebar-foreground: oklch(0.25 0.01 45);
    --sidebar-primary: #F28500;
    --sidebar-primary-foreground: oklch(0.985 0.008 95);
    --sidebar-accent: oklch(0.94 0.015 60);
    --sidebar-accent-foreground: oklch(0.4 0.09 45);
    --sidebar-border: oklch(0.9 0.01 60);
    --sidebar-ring: #F28500;
  }

      @layer base {
        * { border-color: var(--color-border); }
        body {
          background-color: var(--color-background);
          color: var(--color-foreground);
          font-family: var(--font-sans);
        }
        h1, h2, h3, h4, .font-display {
          font-family: var(--font-display);
          letter-spacing: -0.01em;
        }
      }

      @layer utilities {
        .bg-leaf-pattern {
          background-image:
            radial-gradient(circle at 20% 10%, color-mix(in oklab, var(--sage) 20%, transparent), transparent 40%),
            radial-gradient(circle at 80% 90%, color-mix(in oklab, var(--peach) 18%, transparent), transparent 40%);
        }
        .text-shadow-soft { text-shadow: 0 2px 20px rgba(0,0,0,0.25); }
      }
    </style>
  <title>Yogini Planters - Indoor Plant Styling & Wellness</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
